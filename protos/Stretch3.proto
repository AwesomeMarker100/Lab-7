# Hello Robot Stretch 3 mobile manipulator, simplified for CSCI 3302 (Webots R2025a).
# Converted from the MJCF model released by Hello Robot (Apache-2.0, MuJoCo Menagerie
# "hello_robot_stretch_3") with tools/mjcf2proto.py: link frames, joint axes, ranges and
# masses come from the MJCF; collision shapes are simplified boxes/cylinders.
#
# Devices (names follow the stretch_ros joint names):
#   joint_left_wheel / joint_right_wheel   RotationalMotor (velocity control, wheel radius 0.0508 m,
#                                          wheel separation 0.3407 m)
#   joint_lift                             LinearMotor 0 .. 1.1 m (vertical)
#   joint_arm_l0 .. joint_arm_l3           LinearMotor 0 .. 0.13 m each (telescoping arm, total 0.52 m,
#                                          extends along the robot's -y axis = to its right)
#   joint_wrist_yaw / _pitch / _roll       RotationalMotor (dex wrist)
#   joint_gripper_finger_left / _right     RotationalMotor (+ opens, - closes)
#   joint_head_pan / joint_head_tilt       RotationalMotor
#   <name>_sensor                          PositionSensor for every motor above
#   lidar                                  3-D lidar: 360 deg x 16 layers (+-28.6 deg), 0.15 .. 12 m
#   gps, imu                               ground-truth position / orientation
# Add more devices (e.g. a Display) with the bodySlot field.

PROTO Stretch3 [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "Stretch"
  field SFString   controller      "<generic>"
  field MFString   controllerArgs  []
  field SFString   window          "<generic>"
  field SFBool     supervisor      FALSE
  field SFBool     synchronization TRUE
  field SFInt32    lidarResolution 360     # rays per layer (360 deg)
  field SFInt32    lidarLayers     16      # 3-D lidar: number of scan layers
  field SFFloat    lidarVerticalFov 1.0    # [rad] vertical field of view (+-28.6 deg)
